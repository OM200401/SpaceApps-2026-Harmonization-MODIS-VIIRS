<style>
body{display:flex;flex-direction:column;min-height:100vh}
.stage{position:relative;height:calc(100vh - 58px);min-height:520px;overflow:hidden}
#leaflet-map{position:absolute;inset:0;z-index:0}
#map-canvas{display:none;position:absolute;inset:0;width:100%;height:100%;z-index:0}
.leaflet-container{font:inherit}
/* Halo around place names so they stay readable on top of fire cells */
.leaflet-labels-pane{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 2px #fff)}
:root[data-theme="dark"] .leaflet-labels-pane{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1.5px #000) drop-shadow(0 0 2px #000)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-labels-pane{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1.5px #000) drop-shadow(0 0 2px #000)}}
.map-box{position:absolute;inset:0}
.float{position:absolute;z-index:10}
.area-ctl{top:16px;left:16px;padding:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:min(560px,calc(100% - 32px))}
.area-ctl select{border:0;background:transparent;font-weight:600;font-size:15px;padding:6px 8px;max-width:240px}
.area-ctl .coords{padding:0 6px}
.area-ctl .coords[open]{flex-basis:100%}
.area-ctl .coords[open]{padding-bottom:6px}
.area-ctl{width:max-content}

 .stage{height:auto;min-height:0;overflow:visible;display:flex;flex-direction:column;gap:12px;padding:12px 16px 0}

</style></head><body>
<header id="site-header"></header>
<main class="stage">
 <h1 class="sr-only">Fire activity map</h1>
 <div class="map-box">
  <div id="leaflet-map" role="region" aria-label="Fire map. Choose Draw, then drag a rectangle to select an area."></div>
  <canvas id="map-canvas" aria-hidden="true"></canvas>
  <p class="float toast glass" id="map-status" aria-live="polite"></p>
 </div>
 <div class="float area-ctl glass">
  <select id="preset" aria-label="Area"></select>
  <span class="sep" aria-hidden="true"></span>
  <button class="chip" id="draw-region" aria-pressed="false">Draw area</button>
  <button class="chip" id="clear-region" hidden>Reset</button>
  <details class="more coords"><summary>Coordinates</summary>
   <div class="coords-row"><input id="bbox" aria-label="Area as west, south, east, north" aria-describedby="bbox-error"><button id="apply">Apply</button><span id="bbox-error" class="field-error" role="alert"></span></div>
  </details>
 </div>
 <aside class="float insight glass" aria-labelledby="sel-month">
  <div class="where" id="area-name"></div>
  <h2 class="month" id="sel-month">—</h2>
  <span class="pill status-none" id="sel-pill">Loading</span>
  <div class="ratio"><span id="sel-ratio">—</span><small id="sel-ratio-l">vs typical</small></div>
  <div class="counts" id="sel-counts"></div>
  <p class="note" id="sel-note" hidden></p>
  <div class="legend-mini" aria-hidden="true"><span>Less</span><span class="g" id="legend-grad"></span><span>More fire</span></div>
  <a class="btn btn-primary" id="open-report" data-page-link="report.html" href="report.html">Open area report →</a>
  <a class="how" data-page-link="how-it-works.html" href="how-it-works.html">How two satellites become one record</a>
 </aside>
 <div class="float timeline glass">
  <button id="play" aria-pressed="false" aria-label="Play through months">▶</button>
  <div class="spark-wrap">
   <div class="spark-box"><canvas id="spark" role="img" aria-label="Monthly harmonized detections in the selected area, 2001 to present. Click a bar to select that month.">Monthly activity sparkline.</canvas></div>
   <input type="range" id="scrub" step="1" aria-label="Month">
  </div>
  <strong id="scrub-label"></strong>
 </div>
</main>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="shared.js"></script>
<script>
const O = window.OBC, $ = id => document.getElementById(id);
O.renderHeader("index.html"); O.renderFooter();
let S = O.getState(), BBOX = S.bbox, CELLS = [], CELL_DEG = .25, LOAD_ID = 0, LOADED = false, BY_T = new Map(), BY = new Map(), STATS = {}, T0 = O.tOf(O.FIRST_YEAR, 1), T = null, SPARK = null, TIMER = null;
let LEAFLET = null, FALLBACK = false, SELECT_MODE = false;
const isCustom = () => !O.presetFor(BBOX);
let TOAST_T = null;
function toast(msg, ms) { clearTimeout(TOAST_T); $("map-status").textContent = msg; if (ms) TOAST_T = setTimeout(() => $("map-status").textContent = "", ms); }
// Map palette: inferno (perceptually uniform, colour-blind safe). Dark map: brighter = more fire. Light map: darker = more fire.
const INFERNO = [[106,23,110],[147,38,103],[188,55,84],[221,81,58],[243,120,25],[252,165,10],[246,215,70],[252,255,164]];
function fire(t) { t = Math.min(1, Math.max(0, t)); const x = t * (INFERNO.length - 1), i = Math.min(INFERNO.length - 2, Math.floor(x)), f = x - i, c = INFERNO[i].map((v, j) => Math.round(v + (INFERNO[i + 1][j] - v) * f)); return `rgb(${c})`; }
const mapRamp = t => O.isDark() ? fire(.08 + .92 * t) : fire(.82 - .82 * t);
const wide = () => window.matchMedia("(min-width:861px)").matches;
function fitArea() { if (!LEAFLET || FALLBACK) return; LEAFLET.map.fitBounds([[BBOX.south, BBOX.west], [BBOX.north, BBOX.east]], wide() ? { paddingTopLeft: [24, 80], paddingBottomRight: [340, 96] } : { padding: [12, 12] }); }

// ---- area ----
function setArea(next, { fit = true } = {}) {
  BBOX = { west: +next.west.toFixed(4), south: +next.south.toFixed(4), east: +next.east.toFixed(4), north: +next.north.toFixed(4) };
  $("bbox").value = O.formatBBox(BBOX); $("bbox-error").textContent = "";
  O.presetOptions($("preset"), BBOX);
  $("clear-region").hidden = O.formatBBox(BBOX) === O.PRESETS[0].bbox;
  O.setState({ bbox: BBOX });
  $("area-name").textContent = O.areaName(BBOX);
  syncSelection();
  if (fit) fitArea();
  const id = ++LOAD_ID, slow = setTimeout(() => { if (id === LOAD_ID) toast("Loading fire data for this area…"); }, 250);
  O.areaCells(BBOX).then(r => {
    if (id !== LOAD_ID) return;  // a newer area was chosen while this one loaded
    clearTimeout(slow); toast(r.level === "c" ? "Large area: shown with 1° cells." : "", r.level === "c" ? 3500 : 0);
    LOADED = true; CELLS = r.cells; CELL_DEG = r.cellDeg; BY_T = new Map(); CELLS.forEach(c => { const k = O.tOf(c.year, c.month); (BY_T.get(k) || BY_T.set(k, []).get(k)).push(c); }); BY = O.seriesFor(CELLS); STATS = O.monthStats(BY);
    drawSpark(); renderMonth();
  }).catch(err => { if (id === LOAD_ID) { clearTimeout(slow); console.error(err); toast("Couldn't load fire data for this area. Try again."); } });
}
function applyField() { const b = O.parseBBox($("bbox").value); if (!b) { $("bbox-error").textContent = "Enter W,S,E,N as numbers, with W < E and S < N."; return; } setArea(b); }

// ---- month ----
const ym = t => ({ y: Math.floor(t / 12), m: t % 12 + 1 });
function setMonth(t) {
  T = Math.max(T0, Math.min(O.tOf(O.state.END.year, O.state.END.month), t));
  $("scrub").value = T; const { y, m } = ym(T);
  $("scrub-label").textContent = `${O.MO[m - 1]} ${y}`;
  O.setState({ year: y, month: m });
  renderMonth();
}
function renderMonth() {
  if (T == null) return;
  const { y, m } = ym(T), v = O.val(BY, y, m), med = STATS[m] ? STATS[m].p50 : 0;
  $("sel-month").textContent = `${O.MONTH[m - 1]} ${y}`;
  if (!LOADED) return;  // the month label is set; numbers follow once the area's tiles arrive
  const empty = !CELLS.length;
  const ratio = !empty && med > 0 ? v / med : null, st = empty ? { key: "none", label: "No data for this area" } : O.status(ratio);
  $("sel-pill").className = "pill status-" + st.key; $("sel-pill").textContent = st.label;
  $("sel-ratio").textContent = ratio == null ? "—" : ratio.toFixed(1) + "×";
  $("sel-ratio-l").textContent = `vs a typical ${O.MONTH[m - 1]}`;
  $("sel-counts").textContent = empty ? "" : `${O.isEst(y, m) ? "≈ " : ""}${O.fmt(v)} detections · typical ${O.fmt(med)}`;
  const notes = [];
  if (empty) notes.push("No vegetation fires were detected in this area since 2000.");
  if (!empty && O.isEst(y, m)) notes.push("≈ Estimated from MODIS (before S-NPP VIIRS, Feb 2012).");
  if (!empty && O.isProv(y, m)) notes.push("Provisional near-real-time data.");
  $("sel-note").hidden = !notes.length; $("sel-note").textContent = notes.join(" ");
  $("open-report").textContent = empty ? "Open area report →" : `${y} report for this area →`;
  if (SPARK) { const C = O.colors(); SPARK.data.datasets[0].backgroundColor = SPARK.data.labels.map((_, i) => T0 + i === T ? C.ember : C.spark); SPARK.update("none"); }
  drawCells();
}

// ---- sparkline ----
function drawSpark() {
  const endT = O.tOf(O.state.END.year, O.state.END.month), labels = [], data = [];
  for (let t = T0; t <= endT; t++) { const { y, m } = ym(t); labels.push(`${O.MO[m - 1]} ${y}`); data.push(O.val(BY, y, m) || 0); }
  if (!SPARK) {
    SPARK = new Chart($("spark"), { type: "bar", data: { labels, datasets: [{ data, backgroundColor: O.colors().spark, barPercentage: 1, categoryPercentage: .85, borderRadius: 1 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, onClick: (_, els) => { if (els.length) { stop(); setMonth(T0 + els[0].index); } },
        plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: { label: c => O.fmt(c.raw) + " detections" } } }, scales: { x: { display: false }, y: { display: false } } } });
  } else { SPARK.data.labels = labels; SPARK.data.datasets[0].data = data; }
  SPARK.update("none");
}

// ---- play ----
function stop() { clearInterval(TIMER); TIMER = null; $("play").setAttribute("aria-pressed", "false"); $("play").textContent = "▶"; $("play").setAttribute("aria-label", "Play through months"); }
$("play").onclick = () => {
  if (TIMER) return stop();
  const endT = O.tOf(O.state.END.year, O.state.END.month);
  if (T >= endT) setMonth(T0);
  $("play").setAttribute("aria-pressed", "true"); $("play").textContent = "❚❚"; $("play").setAttribute("aria-label", "Pause");
  TIMER = setInterval(() => { if (T >= endT) return stop(); setMonth(T + 1); }, 260);
};
$("scrub").addEventListener("input", e => { stop(); setMonth(+e.target.value); });

// ---- map (Leaflet + region drawing from PR #29; canvas fallback if tiles fail) ----
function setFallback(msg) { FALLBACK = true; $("leaflet-map").style.display = "none"; $("map-canvas").style.display = "block"; toast(msg); drawCells(); }
// From #29: after falling back, probe the tile server a few times and bring the map back if it recovers.
function tileFallbackNow(msg) {
  setFallback(msg);
  [6000, 14000, 30000].forEach(ms => setTimeout(() => {
    if (!FALLBACK || !LEAFLET) return;
    const img = new Image();
    img.onload = () => {
      if (!FALLBACK) return;
      FALLBACK = false; $("leaflet-map").style.display = ""; $("map-canvas").style.display = "none";
      LEAFLET.map.invalidateSize(); fitArea();
      if (LEAFLET.tiles) LEAFLET.tiles.redraw();
      drawCells(); toast("Map tiles are back.", 3000);
    };
    img.src = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/2/1/2?probe=" + Date.now();
  }, ms));
}
function syncSelection() {
  if (!LEAFLET || FALLBACK) return;
  const b = [[BBOX.south, BBOX.west], [BBOX.north, BBOX.east]];
  if (LEAFLET.selection) LEAFLET.selection.setBounds(b); else LEAFLET.selection = L.rectangle(b, { renderer: LEAFLET.renderer, color: O.colors().ember, weight: 2, fill: false, interactive: false }).addTo(LEAFLET.map);
  LEAFLET.selection.bringToFront();
}
// Light map: cividis light-to-dark, so busier cells are darker. Dark map: the same scale reversed, so busier cells are brighter.
function cellColor(share) { return mapRamp(Math.pow(share, .4)); }
function cellsThisMonth() { return T == null ? [] : BY_T.get(T) || []; }
function drawCells() {
  const sel = cellsThisMonth(), max = sel.reduce((a, c) => Math.max(a, c.harmonized_count), 1), { y, m } = T == null ? { y: 0, m: 1 } : ym(T);
  if (LEAFLET && !FALLBACK) {
    const vb = LEAFLET.map.getBounds(); LEAFLET.cells.clearLayers();
    const h = CELL_DEG / 2, vis = sel.filter(c => vb.contains([c.cell_lat + h, c.cell_lon + h]));
    vis.forEach(c => L.rectangle([[c.cell_lat, c.cell_lon], [c.cell_lat + CELL_DEG, c.cell_lon + CELL_DEG]], { renderer: LEAFLET.renderer, stroke: false, fillColor: cellColor(c.harmonized_count / max), fillOpacity: LEAFLET.map.getZoom() >= 7 ? .7 : .9, interactive: false }).addTo(LEAFLET.cells));
    syncSelection();
  } else if (FALLBACK) {
    const cv = $("map-canvas"); cv.width = cv.clientWidth || 1040; cv.height = cv.clientHeight || 520;
    const x = cv.getContext("2d"), { west: w, south: s, east: e, north: n } = BBOX;
    x.fillStyle = O.colors().canvasBg; x.fillRect(0, 0, cv.width, cv.height);
    sel.forEach(c => { const px = (c.cell_lon - w) / (e - w) * cv.width, py = (1 - (c.cell_lat - s) / (n - s)) * cv.height, pw = Math.max(3, CELL_DEG / (e - w) * cv.width), ph = Math.max(3, CELL_DEG / (n - s) * cv.height); x.fillStyle = cellColor(c.harmonized_count / max); x.fillRect(px, py - ph, pw, ph); });
  }
}
const tileURL = () => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${O.isDark() ? "Dark" : "Light"}_Gray_Base/MapServer/tile/{z}/{y}/{x}`;
// Place names come from a separate Esri layer, drawn above the fire cells so they stay readable.
const labelURL = () => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${O.isDark() ? "Dark" : "Light"}_Gray_Reference/MapServer/tile/{z}/{y}/{x}`;
function initLeaflet() {
  if (!window.L) return setFallback("The interactive map couldn't load, so a simple grid view is shown instead.");
  const map = L.map("leaflet-map", { zoomControl: false, worldCopyJump: true, zoomSnap: .25, maxZoom: 16 });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  LEAFLET = { map, cells: L.layerGroup().addTo(map), renderer: L.canvas({ padding: .2 }), selection: null };
  const tiles = L.tileLayer(tileURL(), { maxZoom: 16, attribution: 'Basemap &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors' }).addTo(map);
  map.createPane("labels"); map.getPane("labels").style.zIndex = 650; map.getPane("labels").style.pointerEvents = "none";
  LEAFLET.labels = L.tileLayer(labelURL(), { maxZoom: 16, pane: "labels" }).addTo(map);
  fitArea();
  let ok = false; const errs = new Set();
  LEAFLET.tiles = tiles;
  const timer = setTimeout(() => { if (!ok && !FALLBACK) tileFallbackNow("Map tiles didn't load in time, so a simple grid view is shown instead."); }, 10000);
  tiles.on("tileload", () => { ok = true; clearTimeout(timer); });
  tiles.on("tileerror", e => { const c = e.coords || {}; errs.add(`${c.x}/${c.y}/${c.z}`); if (!ok && errs.size >= 6 && !FALLBACK) { clearTimeout(timer); tileFallbackNow("Map tiles couldn't load, so a simple grid view is shown instead."); } });
  map.on("moveend", drawCells);
  // Draw a box: pointer events, so mouse, pen and touch all work. Shift+drag box zoom also selects.
  let start = null, draft = null, upHandled = false; const box = map.getContainer();
  const exit = cancel => { SELECT_MODE = false; start = null; map.dragging.enable(); box.style.cursor = ""; if (draft) { draft.remove(); draft = null; } $("draw-region").setAttribute("aria-pressed", "false"); $("draw-region").textContent = "Draw area"; if (cancel) toast("Drawing cancelled.", 2500); else toast(""); };
  L.DomEvent.on(box, "pointerdown", e => { if (!SELECT_MODE) return; L.DomEvent.stop(e); upHandled = false; start = map.mouseEventToLatLng(e); draft = L.rectangle([start, start], { renderer: LEAFLET.renderer, color: O.colors().ember, weight: 2, fillOpacity: .08, interactive: false }).addTo(map); });
  L.DomEvent.on(box, "pointermove", e => { if (SELECT_MODE && start && draft) { L.DomEvent.stop(e); draft.setBounds(L.latLngBounds(start, map.mouseEventToLatLng(e))); } });
  L.DomEvent.on(box, "pointerup", e => { if (!SELECT_MODE) return; upHandled = true; L.DomEvent.stop(e); if (start) { const b = L.latLngBounds(start, map.mouseEventToLatLng(e)); if (b.getWest() < b.getEast() && b.getSouth() < b.getNorth()) setArea({ west: b.getWest(), south: b.getSouth(), east: b.getEast(), north: b.getNorth() }, { fit: false }); } exit(false); });
  // From #29: releasing outside the map cancels a drawing in progress.
  L.DomEvent.on(document, "pointerup", e => { if (SELECT_MODE && start && !upHandled) exit(true); upHandled = false; });
  L.DomEvent.on(document, "keydown", e => { if (SELECT_MODE && e.key === "Escape") exit(true); });
  map.on("boxzoomend", e => { const b = e.boxZoomBounds; if (b.getWest() < b.getEast() && b.getSouth() < b.getNorth()) setArea({ west: b.getWest(), south: b.getSouth(), east: b.getEast(), north: b.getNorth() }, { fit: false }); });
  LEAFLET.exitDraw = exit;
}
$("draw-region").onclick = () => {
  if (!LEAFLET || FALLBACK) { toast("The interactive map isn't available. Use Coordinates instead.", 4000); return; }
  if (SELECT_MODE) return LEAFLET.exitDraw(true);
  SELECT_MODE = true; LEAFLET.map.dragging.disable(); LEAFLET.map.getContainer().style.cursor = "crosshair";
  $("draw-region").setAttribute("aria-pressed", "true"); $("draw-region").textContent = "Cancel";
  toast("Drag on the map to draw an area · Esc cancels");
};
const cancelDrawing = () => { if (SELECT_MODE && LEAFLET && LEAFLET.exitDraw) LEAFLET.exitDraw(true); };
$("clear-region").onclick = () => { cancelDrawing(); setArea(O.parseBBox(O.PRESETS[0].bbox)); };
$("preset").onchange = e => { cancelDrawing(); setArea(O.parseBBox(e.target.value)); };
$("apply").onclick = applyField;
$("bbox").addEventListener("keydown", e => { if (e.key === "Enter") applyField(); });

// ---- theme: recolour the canvas-drawn pieces ----
function paintLegend() { $("legend-grad").style.background = `linear-gradient(to right,${[0, .25, .5, .75, 1].map(mapRamp).join(",")})`; }
O.onTheme(() => { if (LEAFLET) { LEAFLET.tiles.setUrl(tileURL()); LEAFLET.labels.setUrl(labelURL()); if (LEAFLET.selection) LEAFLET.selection.setStyle({ color: O.colors().ember }); } paintLegend(); renderMonth(); });
paintLegend();

// ---- start ----
O.loadData().then(() => {
  O.setDataThrough();
  const endT = O.tOf(O.state.END.year, O.state.END.month);
  $("scrub").min = T0; $("scrub").max = endT;
  initLeaflet(); setArea(BBOX, { fit: false });
  setMonth(S.year && S.month ? O.tOf(S.year, S.month) : endT);
}).catch(err => {
  console.error(err);
  toast("Couldn't load the fire data. Try reloading the page.");
  $("sel-pill").textContent = "Data unavailable";
});
</script>
</body></html>
