<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Burning Calendar — harmonized MODIS + VIIRS fire record</title>
<meta name="description" content="A burning activity calendar from harmonized MODIS and VIIRS hotspots: pick an area, see every month since 2001, and how unusual it was.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23e5531a%27/%3E%3Cpath fill=%27%23fff%27 d=%27M12 3c1 3.2-1.4 4.6-1.4 6.9 0 1.3.9 2.3 2.1 2.3 1.5 0 2.2-1.3 2-2.8 1.8 1.5 3.2 3.7 3.2 6C17.9 18.9 15.3 21 12 21s-5.9-2.1-5.9-5.6C6.1 10.6 10.7 8 12 3z%27/%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("obc-theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<link rel="stylesheet" href="shared.css">
<style>
/* One screen on desktop: map and briefing on the left, the calendar on the right. Stacked on small screens. */
body{display:flex;flex-direction:column;height:100vh;overflow:auto}
.work{flex:1 0 auto;height:calc(100vh - 57px);min-height:600px;display:grid;grid-template-columns:minmax(0,1fr) clamp(430px,37vw,640px);grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.eyebrow{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* Header controls */
.header-slot select{font-weight:600;max-width:220px}
.coords{position:relative}
.coords>summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:500;padding:7px 12px;border:1px solid var(--line-2);border-radius:var(--radius-sm)}
.coords>summary::-webkit-details-marker{display:none}
.coords>summary:hover{background:var(--tint)}
.coords .pop{position:absolute;top:calc(100% + 8px);left:0;z-index:1100;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:340px;box-shadow:var(--shadow)}
.coords .pop input{flex:1;min-width:190px}
.coords .pop small{flex-basis:100%;color:var(--ink-3);font-size:12px}

/* Map */
.mapwrap{grid-column:1;grid-row:1;position:relative;overflow:hidden;min-height:0}
#map{position:absolute;inset:0;border-radius:inherit;background:var(--canvas-bg)}
.leaflet-container{font:inherit;background:var(--canvas-bg)}
.leaflet-bar{border:1px solid var(--line-2)!important;box-shadow:none!important;border-radius:10px!important;overflow:hidden}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--card);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--card) 80%,transparent)!important;color:var(--ink-3);font-size:10px}
.leaflet-control-attribution a{color:var(--ink-2)}
.leaflet-labels-pane{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 2px #000)}
:root[data-theme="light"] .leaflet-labels-pane{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff)}
.float{position:absolute;z-index:500}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px}
.stories{top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.stories>*{pointer-events:auto}
.stories .eyebrow{background:var(--glass);padding:5px 9px;border-radius:999px;border:1px solid var(--line)}
.chip{border-radius:999px;padding:5px 12px;font-size:13px;background:var(--glass);backdrop-filter:blur(12px)}
.when{left:12px;bottom:12px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:12px}
#play{width:40px;height:40px;border-radius:50%;padding:0;justify-content:center;background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-size:13px;flex:none}
#play:hover{background:var(--ember-hover)}
.when .mo{font-family:var(--cond);font-size:24px;font-weight:600;line-height:1.05;white-space:nowrap}
.when .sub{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-top:3px;white-space:nowrap}
.when .g{width:84px;height:6px;border-radius:99px;display:inline-block}
.toast{top:52px;left:50%;transform:translateX(-50%);padding:7px 13px;font-size:13px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.toast:empty{display:none}

/* Briefing: three questions a fire manager asks */
.brief{grid-column:1;grid-row:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.q{padding:12px 16px 10px;min-width:0;display:flex;flex-direction:column}
.q h2{font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.q>div{flex:1;display:flex;flex-direction:column}
.q .hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.q .big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1}
.q .line{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.q .line b{color:var(--ink);font-weight:600}
.q svg{display:block;width:100%;margin-top:auto;overflow:visible}
.q svg text{font-family:var(--sans);font-size:10.5px;fill:var(--ink-3)}
.q .hit{cursor:pointer}
.acc{font-size:11.5px;color:var(--ink-3);margin:6px 0 0}
.acc a{color:var(--ink-2)}
.ranks{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.ranks button{width:100%;display:grid;grid-template-columns:18px 38px minmax(0,1fr) 52px;align-items:center;gap:8px;border:0;background:none;padding:3px 4px;font-size:12.5px;border-radius:6px;text-align:left}
.ranks button:hover{background:var(--tint)}
.ranks .rk{color:var(--ink-3);font-size:11px}
.ranks .tr{height:8px;border-radius:0 4px 4px 0;background:var(--bar);min-width:2px}
.ranks .cur .tr{background:var(--ember)}
.ranks .cur .yr{font-weight:600}
.ranks .v{text-align:right;color:var(--ink-2)}
.ranks .gap{font-size:11px;color:var(--ink-3);padding-left:30px;line-height:1}

/* Calendar panel */
.calpanel{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;min-height:0;padding:16px 16px 12px}
.calpanel h1{font-family:var(--cond);font-size:22px;font-weight:600;letter-spacing:0;margin-top:2px}
.calpanel .verdict{font-size:15.5px;line-height:1.4;color:var(--ink-2);margin:4px 0 12px}
.calpanel .verdict b{color:var(--ink);font-weight:600}
.cal-top{display:flex;align-items:center;gap:8px}
.range{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-3)}
.range select{padding:3px 4px;font-size:12.5px;font-family:var(--mono)}
.cal-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.jump{font-size:12.5px;color:var(--ink-2);margin:10px 0 0;padding:8px 10px;border-radius:var(--radius-sm);background:var(--tint);border-left:3px solid var(--ember)}
.jump b{color:var(--ink)}
#cal-body{flex:1;min-height:0;margin-top:12px;position:relative;outline:0}
#cal-body svg{display:block;width:100%;height:100%}
#cal-body svg text{font-family:var(--sans);fill:var(--ink-3);font-size:10.5px}
.cal-foot{margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.scale{display:flex;align-items:center;gap:10px}
.scale .lab{white-space:nowrap}
.scale .bar{flex:1;max-width:260px}
.scale .grad{height:8px;border-radius:99px}
.scale .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);margin-top:2px}
.keys{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:6px}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--cell-empty)}
.keys i.k-prov{outline:1.5px dashed var(--ink-3);outline-offset:-2px}
.keys i.k-part{background:repeating-linear-gradient(45deg,var(--tint),var(--tint) 2px,var(--card) 2px,var(--card) 4px);border:1px solid var(--line)}
.keys i.k-est{background:none;border-top:2px solid var(--ink-3);border-radius:0;height:0;width:16px}
.source{margin:6px 0 0;font-size:11px;color:var(--ink-3)}
.source a{color:var(--ink-2)}

/* Grid view: colour-only cells. Numbers live in the tooltip, the selection read-out and the CSV. */
.cal{height:100%;display:grid;grid-template-rows:18px repeat(var(--n),minmax(6px,1fr)) 34px;gap:2px}
.cal-row{display:grid;grid-template-columns:36px repeat(12,minmax(0,1fr)) 92px;grid-template-rows:minmax(0,1fr);gap:2px;min-height:0;position:relative}
.cal-row>*{min-height:0;line-height:1}
.cal-head span{font-size:10.5px;color:var(--ink-3);text-align:center;font-weight:500;line-height:18px}
.cal-head .m1{display:none}
.cal .yl{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.cal .est .yl{font-style:italic}
.cal .cur .yl{color:var(--ink);font-weight:600}
.cal .c{border-radius:3px;cursor:pointer;min-height:0;background:var(--cell-empty)}
.cal .c:hover{outline:1.5px solid var(--ink-2);outline-offset:0;z-index:1;position:relative}
.cal .c.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:2;position:relative}
.cal .c:focus-visible{outline:2px solid var(--blue);outline-offset:1px;z-index:3;position:relative}
.cal .c.prov{box-shadow:inset 0 0 0 1.5px var(--card);outline:1.5px dashed var(--ink-3);outline-offset:-2px}
.cal .c.prov.sel{outline:2px solid var(--ink);outline-offset:1px}
.cal .c.partial{background:repeating-linear-gradient(45deg,var(--tint),var(--tint) 3px,var(--card) 3px,var(--card) 6px);cursor:default}
.cal .snpp::before{content:"";position:absolute;left:0;right:0;top:-2px;border-top:2px solid var(--ink-3);pointer-events:none}
.cal .yt{display:flex;align-items:center;gap:6px;padding-left:4px;cursor:pointer;min-width:0}
.cal .yt i{height:60%;max-height:10px;min-width:1px;border-radius:0 3px 3px 0;background:var(--bar);flex:none}
.cal .yt b{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink-3)}
.cal .cur .yt i{background:var(--ember)}
.cal .cur .yt b{color:var(--ink)}
.cal-typ{align-items:end}
.cal-typ .yl{font-family:var(--sans);align-self:end;font-size:10px;line-height:1.1;text-align:right}
.cal-typ .mb{height:100%;display:flex;align-items:flex-end;justify-content:center;padding-top:5px}
.cal-typ .mb i{width:62%;min-height:1px;border-radius:3px 3px 0 0;background:var(--bar)}
.cal-typ .mb.cur i{background:var(--ember)}

/* Ridges and clock */
.ridge .area{stroke:none}
.ridge .line{fill:none;stroke:var(--card);stroke-width:1.2}
.ridge.est .line{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.ridge.cur .line{stroke:var(--ink);stroke-width:1.8;stroke-dasharray:none}
.ridge.cur text{fill:var(--ink)!important;font-weight:600}
.guide{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.dot{fill:var(--ember);stroke:var(--card);stroke-width:2}
.clock path{cursor:pointer;stroke:var(--card);stroke-width:.6}
.clock path.sel{stroke:var(--ink);stroke-width:2}
.clock path.none{fill:var(--cell-empty)}
.clock path.partial{fill:none;stroke:var(--line-2);stroke-dasharray:2 2}
.clock .halo{paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.clock .c-mo{font-family:var(--cond);font-size:15px!important;fill:var(--ink-2)!important;font-weight:600}
.clock .c-big{font-family:var(--mono);font-size:26px!important;fill:var(--ink)!important;font-weight:500}
.clock .c-sub{font-size:10.5px!important}

/* Tooltip */
#tip{position:fixed;z-index:2000;pointer-events:none;background:var(--card);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:9px 12px;font-size:12.5px;max-width:270px;color:var(--ink-2)}
#tip b{display:block;color:var(--ink);font-size:13px}
#tip .tv{font-family:var(--mono);font-size:19px;color:var(--ink);display:block;line-height:1.25}
#tip .tn{display:block;color:var(--ink-3);font-size:11.5px;margin-top:3px}

@media (max-height:760px) and (min-width:1001px){.q .big{font-size:28px}.calpanel .verdict{margin-bottom:8px}.source{display:none}}
@media (max-width:1000px){
 body{height:auto}
 .work{display:flex;flex-direction:column;height:auto;min-height:0}
 .mapwrap{height:54vh;min-height:320px;order:1}
 .calpanel{order:2}
 .brief{order:3;grid-template-columns:1fr}
 #cal-body{flex:none}
 #cal-body.v-grid{height:auto}
 .cal{grid-template-rows:18px repeat(var(--n),20px) 34px}
 #cal-body.v-ridges{height:560px}
 #cal-body.v-clock{height:min(92vw,520px)}
 .cal-row{grid-template-columns:34px repeat(12,minmax(0,1fr)) 70px}
 .stories .eyebrow{display:none}
 .cal-head .m3{display:none}
 .cal-head .m1{display:inline}
 .site-header{position:static}
 .site-header .bar{gap:8px}
 .header-end{margin-left:0;flex:1;justify-content:flex-end}
 .leaflet-control-zoom{display:none}
 .when{right:12px}
 .when .sub span:last-child{overflow:hidden;text-overflow:ellipsis}
 .chip{padding:4px 10px;font-size:12.5px}
 .coords .pop{width:min(340px,calc(100vw - 32px))}
}
</style></head><body>
<header id="site-header"></header>
<main class="work">
 <section class="mapwrap panel" aria-label="Fire map">
  <div id="map" role="region" aria-label="Map of fire detections for the selected month. Choose Draw area, then drag a rectangle to select an area."></div>
  <div class="float stories" id="stories"><span class="eyebrow">Jump to</span></div>
  <p class="float toast glass" id="toast" aria-live="polite"></p>
  <div class="float when glass">
   <button id="play" aria-pressed="false" aria-label="Play through months">▶</button>
   <div><div class="mo" id="map-month">—</div>
    <div class="sub"><span>Less</span><span class="g" id="map-grad"></span><span id="map-unit">More fire per cell</span></div></div>
  </div>
 </section>

 <section class="brief" aria-label="Briefing">
  <article class="q panel" aria-labelledby="q1-t"><h2 id="q1-t">Is this month unusual?</h2><div id="q1"></div></article>
  <article class="q panel" aria-labelledby="q2-t"><h2 id="q2-t">When does it burn here?</h2><div id="q2"></div></article>
  <article class="q panel" aria-labelledby="q3-t"><h2 id="q3-t">Which years were worst?</h2><div id="q3"></div></article>
 </section>

 <section class="calpanel panel" aria-labelledby="area-name">
  <div class="cal-top"><span class="eyebrow">Burning activity calendar</span>
   <span class="range"><select id="y0" aria-label="From year"></select>–<select id="y1" aria-label="To year"></select></span></div>
  <h1 id="area-name">—</h1>
  <p class="verdict" id="verdict">Loading the fire record…</p>
  <div class="cal-ctl">
   <div class="seg" id="view" role="group" aria-label="Calendar shape"><button data-v="grid">Grid</button><button data-v="ridges">Ridges</button><button data-v="clock">Clock</button></div>
   <div class="seg" id="mode" role="group" aria-label="What the colours show"><button data-m="harmonized" title="MODIS converted to VIIRS units: one consistent record">Harmonized</button><button data-m="total" title="MODIS + VIIRS simply added together, uncorrected">Raw</button><button data-m="anomaly" title="Each month against its 2003–2020 median">× typical</button></div>
  </div>
  <p class="jump" id="jump" hidden></p>
  <div id="cal-body" tabindex="-1"></div>
  <div class="cal-foot">
   <div class="scale" id="scale" aria-hidden="true"></div>
   <div class="keys" id="keys"></div>
  </div>
 </section>
</main>
<div id="tip" role="tooltip" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="shared.js"></script>
<script src="explore.js"></script>
</body></html>
