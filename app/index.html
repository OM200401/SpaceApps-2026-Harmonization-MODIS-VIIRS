<style>
/* One screen on desktop: the three key numbers on the left, the calendar (or the map) filling the rest. */
body{display:flex;flex-direction:column;height:100vh;overflow:auto}
.work{position:relative;flex:1 0 auto;height:calc(100vh - 57px);min-height:600px;display:grid;grid-template-columns:clamp(290px,23vw,340px) minmax(0,1fr);gap:12px;padding:12px}
.eyebrow{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* Header controls */
.header-slot select{font-weight:600;max-width:220px}
.coords .pop{left:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:340px}
.coords .pop input{flex:1;min-width:190px}
.coords .pop small{flex-basis:100%;color:var(--ink-3);font-size:12px}
.dl .pop{left:0;width:300px;display:flex;flex-direction:column;gap:4px}
.dl .pop p{margin:0 0 6px;font-size:12px;color:var(--ink-3)}
.dl .pop button{justify-content:space-between;width:100%;border:0;text-align:left}
.dl .pop button small{color:var(--ink-3);font-family:var(--mono);font-size:11px}

/* Key numbers */
.metrics{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.q{padding:12px 16px 12px;min-width:0;display:flex;flex-direction:column;flex:none}
.q h2{font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.q>div{display:flex;flex-direction:column}
.q .hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.q .big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1}
.q .line{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.q .line b{color:var(--ink);font-weight:600}
.q svg{display:block;width:100%;margin-top:8px;overflow:visible}
.q svg text{font-family:var(--sans);font-size:10.5px;fill:var(--ink-3)}
.q .hit{cursor:pointer}
.acc{font-size:11.5px;color:var(--ink-3);margin:6px 0 0}
.acc a{color:var(--ink-2)}
.ranks{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.ranks button{width:100%;display:grid;grid-template-columns:18px 38px minmax(0,1fr) 52px;align-items:center;gap:8px;border:0;background:none;padding:3px 4px;font-size:12.5px;border-radius:6px;text-align:left}
.ranks button:hover{background:var(--tint)}
.ranks .rk{color:var(--ink-3);font-size:11px}
.ranks .tr{height:8px;border-radius:0 4px 4px 0;background:var(--bar);min-width:2px}
.ranks .cur .tr{background:var(--ember)}
.ranks .cur .yr{font-weight:600}
.ranks .v{text-align:right;color:var(--ink-2)}
.ranks .gap{font-size:11px;color:var(--ink-3);padding-left:30px;line-height:1}
.dot{fill:var(--ember);stroke:var(--card);stroke-width:2}

/* Stage: calendar by default, the map replaces it */
.stage{grid-column:2;grid-row:1;position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.calview{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 18px 12px}
.cal-top{display:flex;align-items:flex-start;gap:16px}
.cal-top .titles{flex:1;min-width:0}
.cal-top h1{font-family:var(--cond);font-size:24px;font-weight:600;letter-spacing:0;margin-top:2px}
.cal-top .verdict{font-size:15.5px;line-height:1.4;color:var(--ink-2);margin:4px 0 0}
.cal-top .verdict b{color:var(--ink);font-weight:600}
.swap{flex:none;padding:9px 16px;border-radius:999px;font-weight:600}
.swap svg{width:16px;height:16px}
.cal-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.navy{display:inline-flex;align-items:center;gap:4px}
.navy button{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%}
.navy button:disabled{opacity:.35;cursor:default}
.navy strong{font-family:var(--cond);font-size:16px;font-weight:600;min-width:120px;text-align:center}
.range{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-3)}
.range select{padding:4px 6px;font-size:12.5px;font-family:var(--mono)}
.jump{font-size:12.5px;color:var(--ink-2);margin:10px 0 0;padding:8px 10px;border-radius:var(--radius-sm);background:var(--tint);border-left:3px solid var(--ember)}
.jump b{color:var(--ink)}
#cal-body{flex:1;min-height:0;margin-top:12px;position:relative;outline:0;overflow:auto}
.cal-foot{margin-top:8px;font-size:11.5px;color:var(--ink-3);display:flex;gap:6px 24px;flex-wrap:wrap;align-items:center}
.scale{display:flex;align-items:center;gap:10px;flex:1 1 360px}
.scale .lab{white-space:nowrap}
.scale .bar{flex:1;max-width:280px}
.scale .grad{height:8px;border-radius:99px}
.scale .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);margin-top:2px}
.keys{display:flex;gap:4px 14px;flex-wrap:wrap}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--cell-empty)}
.keys i.k-prov{outline:1.5px dashed var(--ink-3);outline-offset:-2px}
.keys i.k-part{background:repeating-linear-gradient(45deg,var(--tint),var(--tint) 2px,var(--card) 2px,var(--card) 4px);border:1px solid var(--line)}
.keys i.k-est{background:none;border-top:2px solid var(--ink-3);border-radius:0;height:0;width:16px}

/* Shared cell look */
.c{border-radius:4px;cursor:pointer;min-height:0;background:var(--cell-empty);position:relative}
.c:hover{outline:1.5px solid var(--ink-2);outline-offset:0;z-index:1}
.c.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.c:focus-visible{outline:2px solid var(--blue);outline-offset:1px;z-index:3}
.c.prov{outline:1.5px dashed var(--ink-3);outline-offset:-3px}
.c.prov.sel{outline:2px solid var(--ink);outline-offset:1px}
.c.partial{background:repeating-linear-gradient(45deg,var(--tint),var(--tint) 3px,var(--card) 3px,var(--card) 6px);cursor:default}
:root[data-contrast] .c{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 45%,transparent)}
:root[data-contrast] .c.sel{outline-width:3px;outline-offset:2px}

/* All years: years down, months across */
.cal{height:100%;min-height:calc(18px + var(--n) * 14px + 34px);display:grid;grid-template-rows:18px repeat(var(--n),minmax(12px,1fr)) 34px;gap:2px}
.cal-row{display:grid;grid-template-columns:36px repeat(12,minmax(0,1fr)) 92px;grid-template-rows:minmax(0,1fr);gap:2px;min-height:0;position:relative}
.cal-row>*{min-height:0;line-height:1}
.cal-head span{font-size:10.5px;color:var(--ink-3);text-align:center;font-weight:500;line-height:18px}
.cal-head .m1{display:none}
.cal .yl{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.cal .est .yl{font-style:italic}
.cal .cur .yl{color:var(--ink);font-weight:600}
.cal .c{border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;overflow:hidden}
.cal .snpp::before{content:"";position:absolute;left:0;right:0;top:-2px;border-top:2px solid var(--ink-3);pointer-events:none}
.cal .yt{display:flex;align-items:center;gap:6px;padding-left:4px;cursor:pointer;min-width:0}
.cal .yt i{height:60%;max-height:10px;min-width:1px;border-radius:0 3px 3px 0;background:var(--bar);flex:none}
.cal .yt b{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink-3)}
.cal .cur .yt i{background:var(--ember)}
.cal .cur .yt b{color:var(--ink)}
.cal-typ{align-items:end}
.cal-typ .yl{font-family:var(--sans);align-self:end;font-size:10px;line-height:1.1;text-align:right}
.cal-typ .mb{height:100%;display:flex;align-items:flex-end;justify-content:center;padding-top:5px}
.cal-typ .mb i{width:62%;min-height:1px;border-radius:3px 3px 0 0;background:var(--bar)}
.cal-typ .mb.cur i{background:var(--ember)}

/* Year and Month views: big tiles with their numbers written in */
.tiles{height:100%;display:grid;gap:8px}
.tiles.year{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(92px,1fr)}
.tile{padding:10px 12px;display:flex;flex-direction:column;gap:2px;color:var(--ink);text-align:left;overflow:hidden;border-radius:8px}
.tile .tn{font-family:var(--cond);font-size:15px;font-weight:600;line-height:1.1;display:flex;justify-content:space-between;gap:6px}
.tile .tn em{font-style:normal;font-family:var(--sans);font-size:11px;font-weight:500;opacity:.85}
.tile .tv{font-family:var(--mono);font-size:clamp(17px,2vw,26px);font-weight:500;letter-spacing:-.02em;line-height:1.1;margin-top:auto}
.tile .tr{font-size:11.5px;opacity:.9;line-height:1.25}
.tile.partial .tn{color:var(--ink-3)}

/* Map view */
.mapview{position:absolute;inset:0}
#map{position:absolute;inset:0;border-radius:inherit;background:var(--canvas-bg)}
.leaflet-container{font:inherit;background:var(--canvas-bg)}
.leaflet-bar{border:1px solid var(--line-2)!important;box-shadow:none!important;border-radius:10px!important;overflow:hidden}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--card);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--card) 80%,transparent)!important;color:var(--ink-3);font-size:10px}
.leaflet-control-attribution a{color:var(--ink-2)}
.leaflet-labels-pane{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 2px #000)}
:root[data-theme="light"] .leaflet-labels-pane{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff)}
.float{position:absolute;z-index:500}
.map-top{top:12px;right:12px;display:flex;gap:8px;align-items:center}
.pick{display:flex;gap:2px;padding:3px;border-radius:999px}
.pick select{border:0;background:transparent;font-weight:600;font-size:13.5px;padding:5px 8px;border-radius:999px;cursor:pointer}
.pick select:hover{background:var(--tint)}
.chip{border-radius:999px;padding:7px 14px;font-size:13px;background:var(--glass);backdrop-filter:blur(12px)}
.when{right:60px;bottom:16px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:10px}
#play{width:40px;height:40px;border-radius:50%;padding:0;justify-content:center;background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-size:13px;flex:none}
#play:hover{background:var(--ember-hover)}
.when .step{width:30px;height:30px;padding:0;justify-content:center;border-radius:50%;background:transparent}
.when .mo{font-family:var(--cond);font-size:22px;font-weight:600;line-height:1.05;white-space:nowrap;min-width:140px}
.when .sub{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-top:3px;white-space:nowrap}
.when .g{width:84px;height:6px;border-radius:99px;display:inline-block}
.toast{top:12px;left:50%;transform:translateX(-50%);padding:7px 13px;font-size:13px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.toast:empty{display:none}

/* In map view the key numbers float over the map as translucent cards */
.view-map .stage{grid-column:1/-1}
.view-map .metrics{position:absolute;top:24px;left:24px;bottom:24px;width:clamp(280px,22vw,320px);z-index:600;pointer-events:none;overflow:auto;scrollbar-width:none}
.view-map .metrics>*{pointer-events:auto}
.view-map .metrics .q{background:color-mix(in srgb,var(--card) 58%,transparent);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);border-color:color-mix(in srgb,var(--line-2) 70%,transparent);box-shadow:var(--shadow)}
.view-map .metrics .dot{stroke:transparent}
:root[data-contrast] .view-map .metrics .q{background:color-mix(in srgb,var(--card) 85%,transparent)}

/* Tooltip */
#tip{position:fixed;z-index:2000;pointer-events:none;background:var(--card);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:9px 12px;font-size:12.5px;max-width:270px;color:var(--ink-2)}
#tip b{display:block;color:var(--ink);font-size:13px}
#tip .tv{font-family:var(--mono);font-size:19px;color:var(--ink);display:block;line-height:1.25}
#tip .tn{display:block;color:var(--ink-3);font-size:11.5px;margin-top:3px}

@media (max-height:760px) and (min-width:1001px){.q .big{font-size:28px}.cal-top .verdict{font-size:14px}}
@media (max-width:1000px){
 body{height:auto}
 .work{display:flex;flex-direction:column;height:auto;min-height:0}
 .stage{order:1;min-height:auto}
 .metrics{order:2;overflow:visible}
 .calview{padding:14px 14px 12px}
 .cal-top{flex-wrap:wrap}
 .range{margin-left:0}
 #cal-body{flex:none;overflow:visible}
 .cal{grid-template-rows:18px repeat(var(--n),20px) 34px;height:auto}
 .cal-row{grid-template-columns:34px repeat(12,minmax(0,1fr)) 64px}
 .cal-head .m3{display:none}
 .cal-head .m1{display:inline}
 .cal .c{font-size:8.5px}
 .tiles{height:auto}
 .tiles.year{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:88px}
 .view-map .stage{height:62vh;min-height:360px}
 .mapview{position:absolute}
 .view-map .metrics{position:static;width:auto;pointer-events:auto;overflow:visible}
 .view-map .metrics .q{background:var(--card);backdrop-filter:none}
 .site-header{position:static}
 .site-header .bar{gap:8px}
 .header-end{margin-left:0;flex:1;justify-content:flex-end}
 .leaflet-control-zoom{display:none}
 .when{left:12px;right:12px;bottom:12px}
 .map-top{left:12px;flex-wrap:wrap;justify-content:flex-end}
 .when .mo{min-width:0;font-size:19px}
 .coords .pop,.dl .pop,.a11y-pop{width:min(320px,calc(100vw - 32px))}
}

 <aside class="metrics" id="metrics" aria-label="Key numbers for the selected month">

    <button class="btn-primary swap" id="to-map" data-tip="Show this area on a map for the selected month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Map</button>
   </div>

    <span class="navy" id="navy"><button id="nav-prev" aria-label="Previous year" data-tip="Previous year">‹</button><strong id="nav-label" aria-live="polite"></strong><button id="nav-next" aria-label="Next year" data-tip="Next year">›</button></span>

   <p class="jump" id="jump" hidden></p>
   <div id="cal-body" tabindex="-1"></div>
   <div class="cal-foot"><div class="scale" id="scale" aria-hidden="true"></div><div class="keys" id="keys"></div></div>
  </div>

  <div class="mapview" id="mapview" hidden>
   <div id="map" role="region" aria-label="Map of fire detections for the selected month. Choose Draw area, then drag a rectangle to select an area."></div>
   <p class="float toast glass" id="toast" aria-live="polite"></p>
   <div class="float map-top"><div class="pick glass" role="group" aria-label="Month shown on the map"><select id="map-m" aria-label="Month" data-tip="Month shown on the map"></select><select id="map-y" aria-label="Year" data-tip="Year shown on the map"></select></div>
    <button id="draw" class="chip toggle" aria-pressed="false" data-tip="Drag a rectangle on the map to choose your own area">Draw area</button>
    <button class="btn-primary swap" id="to-cal" data-tip="Back to the burning calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button></div>
   <div class="float when glass">
    <button id="play" aria-pressed="false" aria-label="Play through months" data-tip="Play through the months as an animation">▶</button>
    <button class="step" id="m-prev" aria-label="Previous month" data-tip="Previous month">‹</button>
    <div><div class="mo" id="map-month">—</div>
     <div class="sub"><span>Less</span><span class="g" id="map-grad"></span><span id="map-unit">More fire per cell</span></div></div>
    <button class="step" id="m-next" aria-label="Next month" data-tip="Next month">›</button>
   </div>
  </div>
 </section>
</main>
<div id="tip" role="tooltip" hidden></div>
